###############################################################################
# analytics-service.yaml
# Kafka consumer — listens to "patient" topic, deserializes Protobuf events.
# No DB, no REST endpoints. Purely event-driven.
###############################################################################

apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  namespace: patient-management
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics-service
  template:
    metadata:
      labels:
        app: analytics-service
    spec:
      containers:
        - name: analytics-service
          image: analytics-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 4002
          env:
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: patient-management-config
                  key: KAFKA_BOOTSTRAP_SERVERS

            # Needed for single-node Kafka (replication factor must be 1)
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"

---

apiVersion: v1
kind: Service
metadata:
  name: analytics-service
  namespace: patient-management
spec:
  selector:
    app: analytics-service
  ports:
    - port: 4002
      targetPort: 4002
