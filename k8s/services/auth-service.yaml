###############################################################################
# auth-service.yaml
# Handles login (JWT issuance) and token validation.
# Talks to: postgres-auth (PostgreSQL DB)
# Called by: api-gateway (to validate tokens on every protected request)
###############################################################################

# ─── RESOURCE 1: Deployment ──────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: patient-management
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: auth-service:latest

          # imagePullPolicy: Never
          # ─────────────────────────────────────────────────────────────────
          # IMPORTANT for local development with Docker Desktop.
          # By default K8s tries to pull images from a remote registry.
          # "Never" tells K8s: "This image is already on the node — use it."
          # Without this, K8s would fail with "ErrImagePull" trying to find
          # "auth-service:latest" on Docker Hub (which doesn't exist).
          # In production you'd use a real registry (ECR, GCR, Docker Hub)
          # and remove this line.
          imagePullPolicy: Never

          ports:
            - containerPort: 4005

          env:
            # ── Database (from ConfigMap — not sensitive) ─────────────────
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: patient-management-config
                  key: AUTH_DB_URL

            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: patient-management-config
                  key: AUTH_DB_USERNAME

            # ── Database password (from Secret — sensitive) ────────────────
            # Notice the difference: configMapKeyRef vs secretKeyRef
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: patient-management-secrets
                  key: POSTGRES_PASSWORD

            # ── JPA / SQL init settings ────────────────────────────────────
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              valueFrom:
                configMapKeyRef:
                  name: patient-management-config
                  key: AUTH_JPA_DDL_AUTO

            - name: SPRING_SQL_INIT_MODE
              valueFrom:
                configMapKeyRef:
                  name: patient-management-config
                  key: AUTH_SQL_INIT_MODE

            # ── JWT Secret (from Secret) ───────────────────────────────────
            # Spring Boot maps env var JWT_SECRET → property jwt.secret
            # via its "relaxed binding" rules (uppercase + underscores → dots)
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: patient-management-secrets
                  key: JWT_SECRET

---

# ─── RESOURCE 2: Service ─────────────────────────────────────────────────────
# ClusterIP = internal only. api-gateway calls auth-service:4005/validate.
# No need to expose this outside the cluster — the gateway is the only caller.
apiVersion: v1
kind: Service
metadata:
  name: auth-service             # ← DNS: auth-service:4005
  namespace: patient-management
spec:
  selector:
    app: auth-service
  ports:
    - port: 4005
      targetPort: 4005
