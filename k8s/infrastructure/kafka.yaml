###############################################################################
# kafka.yaml
# Single-node Kafka using KRaft mode (no Zookeeper needed).
# KRaft = Kafka Raft metadata — Kafka's built-in consensus since v3.3.
#
# Image: apache/kafka:3.7.0 (official Apache Software Foundation image)
# Note: bitnami/kafka moved off Docker Hub → use apache/kafka instead
#
# apache/kafka env var names differ from bitnami:
#   - No "KAFKA_CFG_" prefix — just "KAFKA_" + property name (dots → underscores)
#   - Requires CLUSTER_ID (base64-encoded UUID) for KRaft mode
###############################################################################

apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: patient-management
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.7.0    # ← Official Apache Kafka image (on Docker Hub)
          ports:
            - containerPort: 9092      # ← Client connections (Spring Boot services)
            - containerPort: 9093      # ← KRaft controller port (internal)
          env:
            # ── KRaft identity ────────────────────────────────────────────────
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"   # ← Single node acts as both

            # ── Required for KRaft: a stable cluster identity ─────────────────
            # Generate with: kafka-storage.sh random-uuid | base64
            - name: CLUSTER_ID
              value: "MkU3OEVBNTcwNTJENDM2Qk"

            # ── Listener config ───────────────────────────────────────────────
            # PLAINTEXT: what Spring Boot services connect to
            # CONTROLLER: internal Kafka coordination (not for external use)
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"

            # What address Kafka tells clients to use for connections.
            # Must use the K8s Service name "kafka" — not localhost!
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka:9092"

            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"

            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@kafka:9093"

            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"

            # ── Topic & replication settings (single-node dev) ────────────────
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"

            # ── Log directory ─────────────────────────────────────────────────
            - name: KAFKA_LOG_DIRS
              value: "/tmp/kraft-combined-logs"

---

apiVersion: v1
kind: Service
metadata:
  name: kafka                    # ← DNS hostname used by all pods: kafka:9092
  namespace: patient-management
spec:
  selector:
    app: kafka
  ports:
    - name: client
      port: 9092
      targetPort: 9092
    - name: controller
      port: 9093
      targetPort: 9093
